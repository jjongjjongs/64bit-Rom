name: minifps

# Mini-FPS APK. 게임 소스(minifps/**)가 바뀔 때만 돈다.
on:
  push:
    branches: ["**"]
    paths:
      - "minifps/**"
      - "settings.gradle.kts"
      - ".github/workflows/minifps.yml"
      - ".github/scripts/publish-latest.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform 34 / build-tools 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Bundle the game into assets
        run: |
          # 실사 텍스처·스캔 소품(Poly Haven, CC0)과 병사 모델을 받는다. 저장소에는 넣지 않는다.
          python3 minifps/web/fetch_assets.py
          python3 minifps/web/build.py
          # 문법 오류가 있는 채로 APK 가 되면 폰에서는 빈 화면만 보인다.
          for f in minifps/web/src/*.js; do node --check "$f"; done

      - name: Assemble debug APK
        run: ./gradlew :minifps:assembleDebug --stacktrace

      - name: Verify the game is inside the APK
        run: |
          apk=minifps/build/outputs/apk/debug/minifps-debug.apk
          unzip -l "$apk" | grep -E "assets/(index\.html|three\.min\.js)$"
          [ "$(unzip -l "$apk" | grep -cE 'assets/(index\.html|three\.min\.js)$')" = 2 ] \
            || { echo "::error::게임 파일이 APK 에 없다"; exit 1; }
          unzip -l "$apk" | grep -qE 'assets/a/manifest\.json$' && unzip -l "$apk" | grep -qE 'assets/a/soldier\.glb$' \
            || { echo "::error::텍스처·모델 자료가 APK 에 없다"; exit 1; }
          cp "$apk" "$RUNNER_TEMP/mini-fps.apk"
          ls -l "$RUNNER_TEMP/mini-fps.apk"
          # 앱 안 업데이트가 읽는 설명. 버전은 build.gradle.kts, 바뀐 점은 release-notes.txt 에서 온다.
          python3 minifps/release-meta.py "$RUNNER_TEMP/mini-fps.apk" > "$RUNNER_TEMP/mini-fps.json"
          cat "$RUNNER_TEMP/mini-fps.json"

      - uses: actions/upload-artifact@v4
        with:
          name: mini-fps-apk
          path: ${{ runner.temp }}/mini-fps.apk
          if-no-files-found: error

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/publish-latest.sh minifps "Mini-FPS (mini-fps.apk)" "$RUNNER_TEMP/mini-fps.apk" "$RUNNER_TEMP/mini-fps.json"
