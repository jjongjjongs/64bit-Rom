name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 결과를 "latest" 릴리스에 올리려면 쓰기 권한이 필요하다.
permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform 34 / build-tools 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify native libs are packaged for extraction
        run: |
          # libqemu-system-aarch64.so and libpodroid-launcher.so are PIE executables
          # that GuestRunActivity execs by path from nativeLibraryDir, so they must be
          # unpacked to real files at install time (extractNativeLibs=true).
          #
          # That maps directly onto the zip compression method: legacy packaging
          # DEFLATEs the libs and the installer extracts them, whereas modern
          # packaging STOREs them page-aligned to be mapped straight out of the APK.
          # So asserting "Defl" is a real check that useLegacyPackaging=true held.
          # (Grepping the binary manifest for the attribute name does not work --
          # its string pool is UTF-16, so an ASCII grep silently never matches.)
          apk=app/build/outputs/apk/debug/app-debug.apk
          for lib in libqemu-system-aarch64 libpodroid-launcher; do
            line=$(unzip -v "$apk" | grep -E "lib/arm64-v8a/$lib\.so$") \
              || { echo "::error::$lib.so missing from APK"; exit 1; }
            echo "$line"
            case "$line" in
              *Defl*) ;;
              *) echo "::error::$lib.so is not deflated -- extractNativeLibs is off, QEMU will not start"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 폰에서 받기 쉽게 릴리스에도 올린다. PR 빌드는 남의 브랜치일 수 있어 제외한다.
      - name: Publish to latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/publish-latest.sh apk "앱 (app-debug.apk)" \
            app/build/outputs/apk/debug/app-debug.apk
